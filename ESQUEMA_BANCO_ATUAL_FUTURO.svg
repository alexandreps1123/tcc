<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">Dogefuzz: banco atual e acervo compartilhado sem dupla escrita</title><desc id="desc">Esquemas lógicos simplificados. Atual: quatro tabelas em SQLite por execução. Futuro: cinco tabelas em PostgreSQL central com isolamento por experiment_id e consulta de seeds nas transações.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="1600" height="1160" fill="#f1f5f9"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#475569}.heading{font-size:22px;font-weight:700}.field{font-size:17px}.note{font-size:16px;fill:#475569}.new{fill:#087f5b;font-weight:700}</style><text x="36" y="48" class="title">Dogefuzz — comparação do banco de dados</text><text x="36" y="79" class="subtitle">Proposta de MVP: inputs armazenados nas transações; acervo obtido por consulta.</text><rect x="24" y="105" width="764" height="1000" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="812" y="105" width="764" height="1000" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="48" y="145" class="heading">ATUAL · SQLite por execução</text><text x="48" y="175" class="subtitle">Quatro tabelas; sem identificação de experimento.</text><text x="836" y="145" class="heading">FUTURO · PostgreSQL central</text><text x="836" y="175" class="subtitle">Cinco tabelas; operações isoladas por experiment_id.</text><rect x="60" y="235" width="280" height="143" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M72 235 H328 Q340 235 340 247 V277 H60 V247 Q60 235 72 235" fill="#334155"/><text x="76" y="263" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">tasks</text><text x="76" y="304" class="field">id · PK</text><text x="76" y="331" class="field">arguments / status</text><text x="76" y="358" class="field">expiration / fuzzing_type</text><rect x="450" y="235" width="300" height="170" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M462 235 H738 Q750 235 750 247 V277 H450 V247 Q450 235 462 235" fill="#334155"/><text x="466" y="263" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">contracts</text><text x="466" y="304" class="field">id · PK</text><text x="466" y="331" class="field">task_id · associação</text><text x="466" y="358" class="field">address / bytecodes / ABI</text><text x="466" y="385" class="field">CFG / distance_map</text><rect x="450" y="500" width="300" height="143" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M462 500 H738 Q750 500 750 512 V542 H450 V512 Q450 500 462 500" fill="#334155"/><text x="466" y="528" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">functions</text><text x="466" y="569" class="field">id · PK (UUID local)</text><text x="466" y="596" class="field">contract_id · associação</text><text x="466" y="623" class="field">name / type / callable</text><rect x="60" y="755" width="690" height="197" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M72 755 H738 Q750 755 750 767 V797 H60 V767 Q60 755 72 755" fill="#334155"/><text x="76" y="783" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">transactions</text><text x="76" y="824" class="field">id · PK</text><text x="76" y="851" class="field">task_id / function_id · associações</text><text x="76" y="878" class="field">inputs · payload dos argumentos</text><text x="76" y="905" class="field">hash blockchain / timestamp / status</text><text x="76" y="932" class="field">cobertura / distância / falhas</text><path d="M340 280 L450 280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 405 L600 500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 378 L160 755" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 643 L600 755" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="1031" class="note">Seeds atuais: inputs de transações concluídas</text><text x="60" y="1058" class="note">consultadas pelo function_id daquela execução.</text><rect x="850" y="205" width="690" height="143" rx="12" fill="white" stroke="#087f5b" stroke-width="2"/><path d="M862 205 H1528 Q1540 205 1540 217 V247 H850 V217 Q850 205 862 205" fill="#087f5b"/><text x="866" y="233" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">experiments</text><text x="866" y="274" class="field new">+ id · PK</text><text x="866" y="301" class="field new">+ corpus_group / seed_mode</text><text x="866" y="328" class="field new">+ config_snapshot / started_at</text><rect x="850" y="465" width="290" height="143" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M862 465 H1128 Q1140 465 1140 477 V507 H850 V477 Q850 465 862 465" fill="#334155"/><text x="866" y="493" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">tasks</text><text x="866" y="534" class="field">id · PK</text><text x="866" y="561" class="field new">+ experiment_id · FK</text><text x="866" y="588" class="field">status / arguments</text><rect x="1220" y="425" width="320" height="224" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M1232 425 H1528 Q1540 425 1540 437 V467 H1220 V437 Q1220 425 1232 425" fill="#334155"/><text x="1236" y="453" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">contracts</text><text x="1236" y="494" class="field">id · PK</text><text x="1236" y="521" class="field new">+ experiment_id · FK</text><text x="1236" y="548" class="field">task_id · opcional</text><text x="1236" y="575" class="field new">+ artifact_hash / scenario_key</text><text x="1236" y="602" class="field new">+ auxiliary_role</text><text x="1236" y="629" class="field">address / bytecodes / ABI</text><rect x="1220" y="690" width="320" height="143" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M1232 690 H1528 Q1540 690 1540 702 V732 H1220 V702 Q1220 690 1232 690" fill="#334155"/><text x="1236" y="718" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">functions</text><text x="1236" y="759" class="field">id / contract_id</text><text x="1236" y="786" class="field new">+ experiment_id · FK</text><text x="1236" y="813" class="field new">+ signature / seed_key</text><rect x="850" y="890" width="690" height="197" rx="12" fill="white" stroke="#334155" stroke-width="2"/><path d="M862 890 H1528 Q1540 890 1540 902 V932 H850 V902 Q850 890 862 890" fill="#334155"/><text x="866" y="918" style="font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:white">transactions</text><text x="866" y="959" class="field">id / task_id / function_id</text><text x="866" y="986" class="field new">+ experiment_id · FK</text><text x="866" y="1013" class="field">inputs · única fonte por execução</text><text x="866" y="1040" class="field new">+ input_hash / seed_eligible</text><text x="866" y="1067" class="field new">+ seed_source_transaction_id · FK</text><path d="M980 348 L980 465" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1420 348 L1420 425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1140 520 L1220 520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1420 649 L1420 690" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M980 608 L980 890" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1420 833 L1420 890" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="1140" class="note">Esquemas lógicos resumidos; campos omitidos permanecem. Verde: campos novos. Acervo futuro = consulta, sem tabela/cópia adicional.</text></svg>